services:
  gear-generator:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - path: .env
        required: false
      - path: gear_engineering/.env
        required: false
    command: ["bash"]

  agentic-gui:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
      - path: gear_engineering/.env
        required: false
    command: ["python", "-m", "streamlit", "run", "app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
